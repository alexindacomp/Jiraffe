<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jiraffe</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Icon sprite (inline, no network). Stroke icons use currentColor. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-logo" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="10" fill="#FFF200"/>

    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>

    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>

    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>

    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"/></symbol>

    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>

    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>

    <!-- v0.5: issue form + rich-text editor -->
    <!-- v0.6: issue panel -->
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-heading-3" viewBox="0 0 24 24"><path d="M4 6v12M12 6v12M4 12h8"/><path d="M16.5 8.5a2 2 0 1 1 2.5 3 2 2 0 1 1-2.5 3"/></symbol>
    <symbol id="i-heading-4" viewBox="0 0 24 24"><path d="M4 6v12M12 6v12M4 12h8"/><path d="M19 18V8l-3.5 6H21"/></symbol>
    <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/></symbol>
    <symbol id="i-italic" viewBox="0 0 24 24"><path d="M19 4h-9M14 20H5M15 4 9 20"/></symbol>

    <symbol id="i-strike" viewBox="0 0 24 24"><path d="M16 5.5A4 4 0 0 0 12.5 4h-1A3.5 3.5 0 0 0 8 7.5c0 1.6 1 2.5 2.6 3M4 12h16M8.5 18.5A4 4 0 0 0 12 20h.5a3.5 3.5 0 0 0 3.5-3.5c0-.7-.2-1.3-.5-1.8"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
    <symbol id="i-list-ul" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-list-ol" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 4h1.5v4M3.5 8h3M3.5 13.5a1.5 1.5 0 0 1 3 .2c0 .8-3 2.3-3 2.3h3"/></symbol>
    <symbol id="i-indent" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M4 18h16M4 8l3 2-3 2"/></symbol>
    <symbol id="i-outdent" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M4 18h16M7 8l-3 2 3 2"/></symbol>

<!-- v0.7: the window buttons come first in the Tab order (like a title bar); outside #app so they work while a dialog
     makes the app inert. The drag strip and the resize edges follow the scrim below. -->
<div class="win-btns" role="group" data-i18n-attr="aria-label:win.label">
  <button type="button" class="win-btn" data-win="minimize" data-i18n-attr="aria-label:win.minimize;title:win.minimize"><svg class="icon" aria-hidden="true"><use href="#i-win-min"/></svg></button>
  <button type="button" class="win-btn" id="win-max" data-win="toggleMaximize" data-i18n-attr="aria-label:win.maximize;title:win.maximize"><svg class="icon" aria-hidden="true"><use href="#i-win-max"/></svg></button>
  <button type="button" class="win-btn win-close" data-win="close" data-i18n-attr="aria-label:win.close;title:win.closeTitle"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
</div>
<div class="app" id="app">
  <!-- v0.7: the sidebar is one glass panel; its empty areas drag the (frameless) window -->
  <nav class="rail" data-drag data-i18n-attr="aria-label:nav.label">
    <div class="brand" aria-hidden="true">
      <span class="brand-mark"><svg class="brand-glyph"><use href="#i-mark"/></svg></span>
    </div>
    <ul class="nav" role="list">
      <li><button type="button" class="nav-item" data-view="board" data-i18n-attr="title:nav.board"><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg><span class="nav-label" data-i18n="nav.board"></span></button></li>
      <li><button type="button" class="nav-item" data-view="sprints" data-i18n-attr="title:nav.sprints"><svg class="icon" aria-hidden="true"><use href="#i-sprint"/></svg><span class="nav-label" data-i18n="nav.sprints"></span></button></li>
      <li><button type="button" class="nav-item" data-view="epics" data-i18n-attr="title:title.epics"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg><span class="nav-label" data-i18n="nav.epics"></span></button></li>
      <li><button type="button" class="nav-item" data-view="worklog" data-i18n-attr="title:nav.worklog"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span class="nav-label" data-i18n="nav.worklog"></span></button></li>
      <li><button type="button" class="nav-item" data-view="projects" data-i18n-attr="title:nav.projects"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg><span class="nav-label" data-i18n="nav.projects"></span></button></li>
      <li class="nav-foot"><button type="button" class="nav-item" data-view="notifications" id="nav-notifications" data-i18n-attr="title:nav.notifications"><span class="nav-icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span class="nav-badge" id="nav-badge" hidden></span></span><span class="nav-label" data-i18n="nav.notifications"></span></button></li>
      <li><button type="button" class="nav-item" data-view="settings" data-i18n-attr="title:nav.settings"><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg><span class="nav-label" data-i18n="nav.settings"></span></button></li>
    </ul>
    <div class="rail-foot">
      <button type="button" class="avatar-btn" id="avatar-btn">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="avatar-dot" id="avatar-dot" aria-hidden="true"></span>
      </button>
      <span class="rail-version" id="app-version"></span>
    </div>
  </nav>

  <div class="main">
    <header class="topbar" data-drag>
      <div class="view-head">
        <p class="view-eyebrow"><span class="eyebrow-dot" id="eyebrow-dot" aria-hidden="true"></span><span id="eyebrow-text">Jiraffe</span></p>
        <h1 class="view-title" id="view-title" tabindex="-1"></h1>
      </div>
      <div class="view-tools" id="view-tools" hidden>
        <div class="search" id="search-wrap">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="search" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <label class="mine-toggle" id="mine-wrap" data-i18n-attr="title:scope.mine" hidden>
          <input type="checkbox" role="switch" class="switch" id="mine-toggle">
          <span data-i18n="scope.mine"></span>
        </label>
        <label class="mine-toggle" id="reported-wrap" data-i18n-attr="title:scope.reportedTitle" hidden>
          <input type="checkbox" role="switch" class="switch" id="reported-toggle">
          <span data-i18n="scope.reported"></span>
        </label>
        <div class="project-filter" id="project-filter">
          <div class="chips" id="project-chips" role="radiogroup" data-i18n-attr="aria-label:projectFilter.label" hidden></div>
          <button type="button" class="picker-btn picker-btn-sm" id="project-menu-btn" aria-haspopup="menu" aria-expanded="false" hidden></button>
        </div>
      </div>
      <div class="topbar-end">
        <button type="button" class="btn btn-primary btn-create" id="create-btn" data-i18n-attr="title:cf.createShortcut" hidden><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="btn-create-label" data-i18n="cf.createShort"></span></button>
        <button type="button" class="icon-btn icon-btn-well" id="refresh-btn" data-i18n-attr="aria-label:common.refreshShortcut;title:common.refreshShortcut">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
      </div>
      <span class="win-btns-room" aria-hidden="true"></span><!-- the window buttons (.win-btns) sit here, outside #app -->
    </header>

    <!-- v0.7.1: missed worklog days (Board and Worklog), rendered by app.js -->
    <div id="missed-notice" hidden></div>

    <main class="views" id="views">
      <!-- App-level loading / fatal error -->
      <section class="view view-status" id="view-status" hidden></section>

      <!-- Board -->
      <section class="view view-board" id="view-board" hidden>
        <div class="view-toolbar board-bar" id="board-bar" hidden>
          <button type="button" class="picker-btn picker-btn-sm" id="board-picker" aria-haspopup="menu" aria-expanded="false" hidden></button>
          <p class="board-note" id="board-note" hidden></p>
        </div>
        <div class="board kanban" id="board" data-kanban="board"></div>
      </section>

      <!-- Sprints -->
      <section class="view view-sprints" id="view-sprints" hidden>
        <div class="view-toolbar">
          <label class="mine-toggle" id="sp-closed-wrap">
            <input type="checkbox" role="switch" class="switch" id="sp-closed">
            <span data-i18n="sprints.showClosed"></span>
          </label>
          <p class="toolbar-note" id="sp-summary" aria-live="polite"></p>
        </div>
        <div class="tree-scroll" id="sp-scroll"><div class="tree-page" id="sp-list"></div></div>
      </section>

      <!-- Epics & stories -->
      <section class="view view-epics" id="view-epics" hidden>
        <div class="view-toolbar">
          <div class="segmented" id="ep-mode" role="radiogroup" data-i18n-attr="aria-label:epics.modeLabel">
            <button type="button" role="radio" class="seg-btn" data-mode="epics" data-i18n="epics.modeEpics"></button>
            <button type="button" role="radio" class="seg-btn" data-mode="stories" data-i18n="epics.modeStories"></button>
          </div>
          <label class="mine-toggle">
            <input type="checkbox" role="switch" class="switch" id="ep-done">
            <span data-i18n="epics.showDone"></span>
          </label>
          <p class="toolbar-note" id="ep-summary" aria-live="polite"></p>
        </div>
        <div class="tree-scroll" id="ep-scroll"><div class="tree-page" id="ep-list"></div></div>
      </section>

      <!-- Projects -->
      <section class="view view-scroll" id="view-projects" hidden>
        <div class="page page-narrow">
          <div class="list-head">
