name: build

# push to master / pull request: vet, test and build jiraffe.exe (workflow artifact).
# push of a tag vX.Y.Z: the same, then publish GitHub release vX.Y.Z with jiraffe.exe.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version of non-tag builds

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tags must look like v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Vet, test and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh --check

      - uses: actions/upload-artifact@v4
        with:
          name: jiraffe-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: build/jiraffe.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-run of the workflow: replace the binary, keep the notes
            gh release upload "$TAG" dist/jiraffe.exe --clobber
          else
            # release notes = the annotated tag message (git tag -a vX.Y.Z -F notes.md)
            gh release create "$TAG" dist/jiraffe.exe \
              --title "Jiraffe $TAG" --notes-from-tag --verify-tag --latest
          fi
