name: build

# push to master / pull request: vet, test and build jiraffe.exe (workflow artifact).
# push of a tag vX.Y.Z: the same, then publish GitHub release vX.Y.Z with jiraffe.exe.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version of non-tag builds

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tags must look like v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Vet, test and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh --check

      - name: Checksum
        working-directory: build
        run: sha256sum jiraffe.exe | tee jiraffe.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jiraffe-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/jiraffe.exe
            build/jiraffe.exe.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the signing key lives in this environment, which only v* tags may deploy to
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no restored cache in the job that holds the signing key

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c jiraffe.exe.sha256)
          go run ./tools/sign -version "${TAG#v}" -file dist/jiraffe.exe > dist/jiraffe.exe.sig
          test -s dist/jiraffe.exe.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-run of the workflow: replace the binary, keep the notes
            gh release upload "$TAG" dist/jiraffe.exe dist/jiraffe.exe.sha256 dist/jiraffe.exe.sig --clobber
          else
            # release notes = the annotated tag message (git tag -a vX.Y.Z -F notes.md)
            gh release create "$TAG" dist/jiraffe.exe dist/jiraffe.exe.sha256 dist/jiraffe.exe.sig \
              --title "Jiraffe $TAG" --notes-from-tag --verify-tag --latest
          fi
